name: expenses
description: Managing expenses.

publish_to: 'none'

version: 0.0.1+1

environment:
  sdk: ^3.1.1

dependencies:
  flutter:
    sdk: flutter
  intl: ^0.20.2
  fl_chart: ^1.0.0

  english_words: ^4.0.0
  provider: ^6.0.0
  firebase_core: ^4.1.1
  firebase_analytics: ^12.0.2
  firebase_auth: ^6.1.0
  google_sign_in: ^6.2.1
  cloud_firestore: ^6.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon/receipt.png
    - assets/icon/google.png

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon/spending.png"
